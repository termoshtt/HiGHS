name: Build Pyodide WASM Wheel

on:
  push:
    branches:
      - master
  pull_request: {}
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build wasm wheel
        uses: pypa/cibuildwheel@v3.3
        env:
          CIBW_PLATFORM: pyodide
          CIBW_BUILD: cp313-pyodide_wasm32

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wasm-wheel
          path: ./wheelhouse

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wasm-wheel
          path: ./wheelhouse

      - name: NPM install
        run: npm ci --prefix tests_wasm

      - name: Run test
        run: node tests_wasm/test_highs.js
